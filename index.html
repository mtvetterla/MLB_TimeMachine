<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLB // Baseball Time Machine</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

:root {
    --cream: #f5e8c8;
    --paper: #e8d5a8;
    --ink: #201c16;
    --red: #c9362b;
    --blue: #183a59;
    --green: #315b42;
    --yellow: #e5b94d;
    --shadow: #8b7350;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background:
        linear-gradient(rgba(20,20,20,.035) 50%, transparent 50%),
        #17221d;
    background-size: 100% 4px;
    color: var(--ink);
    font-family: 'VT323', monospace;
    font-size: 21px;
}

/* CRT overlay */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(0,0,0,.06) 0px,
            rgba(0,0,0,.06) 1px,
            transparent 1px,
            transparent 4px
        );
    z-index: 999;
    mix-blend-mode: multiply;
}

header {
    background:
        radial-gradient(circle at center, #244d38 0, #102019 70%);
    color: var(--cream);
    border-bottom: 8px solid var(--yellow);
    padding: 35px 20px 30px;
    text-align: center;
    box-shadow: 0 8px 0 #0b120f;
}

.logo {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(22px, 4vw, 42px);
    line-height: 1.5;
    color: #fff3c7;
    text-shadow:
        4px 4px 0 var(--red),
        8px 8px 0 #000;
}

.subtitle {
    margin-top: 20px;
    color: #e5d6ad;
    letter-spacing: 2px;
}

.scoreboard {
    max-width: 1100px;
    margin: 25px auto 0;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
}

.scoreboard span {
    background: #090d0b;
    border: 3px solid #4d6657;
    padding: 8px 13px;
    color: #e3c55d;
    font-family: 'Press Start 2P';
    font-size: 9px;
}

.container {
    width: min(1400px, 94%);
    margin: auto;
}

.controls {
    margin: 30px auto;
    padding: 20px;
    background: var(--paper);
    border: 5px solid var(--ink);
    box-shadow: 8px 8px 0 var(--shadow);
}

.controls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
}

input,
button,
select {
    font: inherit;
    border: 3px solid var(--ink);
    background: #fff5d9;
    color: var(--ink);
    padding: 9px 12px;
    box-shadow: 3px 3px 0 var(--ink);
}

input {
    flex: 1;
    min-width: 220px;
}

button {
    cursor: pointer;
    background: var(--red);
    color: white;
    font-family: 'Press Start 2P';
    font-size: 9px;
}

button:hover,
button.active {
    background: var(--blue);
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 var(--ink);
}

.section-title {
    color: var(--cream);
    font-family: 'Press Start 2P';
    font-size: 15px;
    margin: 35px 0 20px;
    text-shadow: 3px 3px #000;
}

.teams {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 22px;
    padding-bottom: 50px;
}

.card {
    position: relative;
    background:
        linear-gradient(135deg, rgba(255,255,255,.2), transparent 35%),
        var(--cream);
    border: 5px solid var(--ink);
    box-shadow: 7px 7px 0 #000;
    cursor: pointer;
    transition: .12s ease;
    overflow: hidden;
}

.card:hover {
    transform: translate(-3px, -3px);
    box-shadow: 11px 11px 0 #000;
}

.card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 12px;
    background: var(--team-color);
}

.card-header {
    padding: 25px 18px 12px;
    display: flex;
    gap: 15px;
    align-items: center;
}

.logo-pixel {
    width: 62px;
    height: 62px;
    display: grid;
    place-items: center;
    background: var(--team-color);
    color: white;
    border: 4px solid var(--ink);
    font-family: 'Press Start 2P';
    font-size: 15px;
    box-shadow: 4px 4px 0 var(--ink);
}

.team-name {
    font-family: 'Press Start 2P';
    font-size: 11px;
    line-height: 1.5;
}

.location {
    color: #604a32;
    margin-top: 5px;
}

.card-body {
    padding: 5px 18px 20px;
}

.card-body p {
    margin: 6px 0;
}

.tag {
    display: inline-block;
    padding: 3px 7px;
    margin: 3px 3px 3px 0;
    background: var(--team-color);
    color: white;
    border: 2px solid var(--ink);
    font-size: 16px;
}

.year {
    font-family: 'Press Start 2P';
    color: var(--red);
}

.click {
    display: block;
    text-align: right;
    color: #725f42;
    font-size: 16px;
    margin-top: 12px;
}

/* Modal */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.82);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
}

.modal.open {
    display: flex;
}

.modal-box {
    width: min(850px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background: var(--cream);
    border: 7px solid var(--ink);
    box-shadow: 12px 12px 0 #000;
}

.modal-top {
    padding: 25px;
    background: var(--team-color);
    color: white;
    border-bottom: 5px solid var(--ink);
}

.modal-top h2 {
    font-family: 'Press Start 2P';
    font-size: 19px;
    line-height: 1.6;
    margin: 0;
}

.modal-content {
    padding: 25px;
}

.close {
    float: right;
    margin-left: 15px;
    background: #111;
}

.timeline {
    border-left: 5px dotted var(--ink);
    margin: 25px 0 15px 15px;
    padding-left: 25px;
}

.timeline-item {
    position: relative;
    margin-bottom: 24px;
}

.timeline-item::before {
    content: "";
    position: absolute;
    width: 13px;
    height: 13px;
    border: 3px solid var(--ink);
    background: var(--red);
    left: -35px;
    top: 3px;
}

.timeline-year {
    font-family: 'Press Start 2P';
    font-size: 11px;
    color: var(--red);
    margin-bottom: 7px;
}

footer {
    background: #0d1712;
    color: #a8a17d;
    text-align: center;
    padding: 40px 20px;
    border-top: 6px solid var(--yellow);
}

footer .pixel {
    font-family: 'Press Start 2P';
    font-size: 11px;
    line-height: 2;
}

.empty {
    color: var(--cream);
    text-align: center;
    grid-column: 1/-1;
    padding: 50px;
}

@media(max-width:600px) {
    .teams {
        grid-template-columns: 1fr;
    }

    .controls-row {
        flex-direction: column;
        align-items: stretch;
    }

    input {
        min-width: 0;
    }

    .logo {
        font-size: 20px;
    }
}
</style>
</head>

const teamGrid = document.getElementById("teams");
const search = document.getElementById("search");
const filters = document.querySelectorAll(".filter");

let currentLeague = "ALL";

function renderTeams() {

    const query = search.value.toLowerCase().trim();

    const filtered = teams.filter(team => {

        const leagueMatch =
            currentLeague === "ALL" ||
            team.league === currentLeague;

        const searchMatch =
            !query ||
            team.name.toLowerCase().includes(query) ||
            team.city.toLowerCase().includes(query) ||
            team.summary.toLowerCase().includes(query) ||
            team.history.some(item =>
                item.join(" ").toLowerCase().includes(query)
            );

        return leagueMatch && searchMatch;
    });

    if (!filtered.length) {
        teamGrid.innerHTML =
            `<div class="empty">NO CLUB FOUND_</div>`;
        return;
    }

    teamGrid.innerHTML = filtered.map((team, index) => {

        return `
        <article
            class="card"
            style="--team-color:${team.color}"
            onclick="openTeam('${team.short}')"
        >
            <div class="card-header">
                <div class="logo-pixel">${team.short}</div>

                <div>
                    <div class="team-name">${team.name}</div>
                    <div class="location">📍 ${team.city}</div>
                </div>
            </div>

            <div class="card-body">
                <p>
                    <span class="year">${team.origin}</span>
                    — franchise origin
                </p>

                <p>${team.summary}</p>

                <span class="tag">${team.league === "AL" ? "AMERICAN" : "NATIONAL"}</span>
                <span class="tag">${team.championships}</span>

                <span class="click">[ CLICK TO EXPLORE ]</span>
            </div>
        </article>
        `;
    }).join("");
}

function openTeam(short) {

    const team = teams.find(t => t.short === short);

    if (!team) return;

    document.documentElement.style
        .setProperty("--team-color", team.color);

    document.getElementById("modalName").textContent =
        team.name;

    document.getElementById("modalLocation").textContent =
        `📍 ${team.city} // ${team.league === "AL" ? "AMERICAN LEAGUE" : "NATIONAL LEAGUE"}`;

    document.getElementById("modalSummary").textContent =
        team.summary;

    document.getElementById("timeline").innerHTML =
        team.history.map(item => `
            <div class="timeline-item">
                <div class="timeline-year">${item[0]}</div>
                <div>${item[1]}</div>
            </div>
        `).join("");

    document.getElementById("modalTags").innerHTML = `
        <span class="tag">${team.origin} ORIGIN</span>
        <span class="tag">${team.championships}</span>
        <span class="tag">${team.league === "AL" ? "AL" : "NL"}</span>
    `;

    document.getElementById("modal").classList.add("open");
}

function closeModal() {
    document.getElementById("modal").classList.remove("open");
}

search.addEventListener("input", renderTeams);

filters.forEach(button => {

    button.addEventListener("click", () => {

        filters.forEach(b => b.classList.remove("active"));

        button.classList.add("active");

        currentLeague =
            button.dataset.league;

        renderTeams();
    });

});

document.getElementById("modal").addEventListener("click", e => {

    if (e.target.id === "modal") {
        closeModal();
    }

});

document.addEventListener("keydown", e => {

    if (e.key === "Escape") {
        closeModal();
    }

});

renderTeams();
</script>
